server:
  port: ${SERVER_PORT:7504}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/smartscraper_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:smartscraper_user}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true
        jdbc.batch_size: 20

  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
    prefix: classpath:/templates/
    suffix: .html

  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin}

  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100
      thread-name-prefix: async-

# Application specific settings
app:
  scraping:
    timeout-ms: ${SCRAPING_TIMEOUT:10000}
    max-urls-per-domain: ${MAX_URLS_PER_DOMAIN:2}
    target-url-count: ${TARGET_URL_COUNT:20}
    user-agent: ${USER_AGENT:SmartScraper/1.0 (Educational Research Tool)}
  puppeteer:
    render-url: ${PUPPETEER_RENDER_URL:http://localhost:3001/render?url=}
    api-base-url: ${PUPPETEER_API_BASE_URL:http://localhost:3001}
    api-timeout-ms: ${PUPPETEER_API_TIMEOUT_MS:30000}
    dynamic-domains: ${PUPPETEER_DYNAMIC_DOMAINS:}
  
  relevance:
    min-keyword-frequency: ${MIN_KEYWORD_FREQ:0.3}
    min-content-length: ${MIN_CONTENT_LENGTH:100}
    min-overall-score: ${MIN_OVERALL_SCORE:0.4}
  
  pagination:
    default-page-size: ${PAGE_SIZE:20}
    max-page-size: ${MAX_PAGE_SIZE:100}

  scheduled:
    # Cron schedules (Spring cron: 6 fields)
    news:
      cron: ${SCHEDULED_NEWS_CRON:0 0 9 * * *}
      query: ${SCHEDULED_NEWS_QUERY:latest}
    products:
      cron: ${SCHEDULED_PRODUCTS_CRON:0 0 */6 * * *}
      query: ${SCHEDULED_PRODUCTS_QUERY:phone}
    # Dedicated DB user used only for background scraping/searchHistory creation
    scheduler-username: ${SCHEDULED_SCHEDULER_USERNAME:scheduler}
    scheduler-email: ${SCHEDULED_SCHEDULER_EMAIL:scheduler@smartscraper.local}

# Logging configuration
logging:
  level:
    root: INFO
    com.smartscraper: ${LOG_LEVEL:INFO}
    org.springframework.web: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/smartscraper.log}
    max-size: 10MB
    max-history: 30

# Management endpoints (Spring Boot Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true
