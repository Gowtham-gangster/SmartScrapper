<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research - SmartScraper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">SmartScraper</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">
                    <i class="bi bi-person-circle"></i> <span th:text="${username}">User</span>
                </span>
                <a href="/dashboard" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-house"></i> Dashboard
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <!-- Page Header -->
        <div class="row mb-4">
            <div class="col-md-12">
                <h2><i class="bi bi-search text-primary"></i> Research Module</h2>
                <p class="text-muted">Enter a research topic to gather comprehensive information from multiple sources</p>
            </div>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Research Search Form -->
        <div class="row mb-5">
            <div class="col-md-8 mx-auto">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h4 class="card-title mb-4">Start Your Research</h4>
                        <form th:action="@{/research/search}" method="post">
                            <div class="mb-3">
                                <label for="topicName" class="form-label">Research Topic</label>
                                <input type="text" 
                                       class="form-control form-control-lg" 
                                       id="topicName" 
                                       name="topicName" 
                                       placeholder="e.g., Artificial Intelligence, Climate Change, Quantum Computing"
                                       required>
                                <div class="form-text">Enter a topic to research. We'll gather information from multiple sources.</div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="bi bi-search"></i> Start Research
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Searches -->
        <div class="row" th:if="${recentSearches != null and !recentSearches.isEmpty()}">
            <div class="col-md-10 mx-auto">
                <h5 class="mb-3">Recent Research Searches</h5>
                <div class="list-group">
                    <a th:each="search : ${recentSearches}" 
                       th:href="@{/research/results(searchId=${search.id})}"
                       class="list-group-item list-group-item-action">
                        <div class="d-flex w-100 justify-content-between">
                            <h6 class="mb-1">
                                <i class="bi bi-clock-history text-muted"></i>
                                <span th:text="${search.queryText}">Topic</span>
                            </h6>
                            <small th:text="${#temporals.format(search.searchedAt, 'MMM dd, yyyy HH:mm')}">Date</small>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
